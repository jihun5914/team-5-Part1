<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>김지훈 자기소개</title>
  <style>
    /* --- 홈 버튼 디자인 (CSS) 추가 --- */
    .home-btn {
      position: fixed;   /* 화면에 고정 */
      top: 20px;         /* 위에서 20px */
      right: 20px;       /* 오른쪽에서 20px */
      background-color: #ff6b35; /* 지훈님 페이지 테마색 */
      color: white;
      padding: 10px 20px;
      border-radius: 20px; /* 둥근 버튼 */
      text-decoration: none; /* 밑줄 제거 */
      font-size: 14px;
      font-weight: bold;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      transition: background-color 0.2s, transform 0.2s;
      z-index: 1000;     /* 다른 요소 위에 뜨게 함 */
    }

    .home-btn:hover {
      background-color: #e55a2b; /* 마우스 올렸을 때 더 진한 색 */
      transform: translateY(-2px); /* 살짝 위로 뜨는 효과 */
    }
    /* ---------------------------------- */

    body {
      font-family: sans-serif;
      max-width: 650px;
      margin: 80px auto 50px auto; /* 홈 버튼 공간 확보를 위해 위쪽 여백(margin-top)을 80px로 늘림 */
      background-color: #fffdf0;
      color: #333;
      padding: 0 20px; /* 모바일에서 좌우 여백 확보 */
    }
    h1 {
      text-align: center;
      font-size: 2rem;
      color: #ff6b35;
    }
    h2 {
      border-left: 5px solid #ff6b35;
      padding-left: 10px;
      margin-top: 30px;
    }
    li { line-height: 2; }
  </style>
</head>
<body>
  <a href="index.html" class="home-btn">🏠 홈으로</a>
  <h1>🪣 자기소개</h1>
  <p>이름: 김지훈 | 나이: 20대 | MBTI: INTJ, INTP</p>

  <h2> 취미 </h2>
  <ul>
    <li>게임</li>
    <li>운동</li>
  </ul>

  <h2>좋아하는 음식</h2>
  <ul>
    <li>고기류</li>
  </ul>

  <h2>💻 개발자 목표</h2>
  <ul>
    <li>내가 원하는 사이트 만들기 </li>
  </ul>
</body>
</html>
